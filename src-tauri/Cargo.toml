[package]
name = "codex-mosaic"
version = "0.0.2"
description = "A multi-conversation Codex workspace"
edition = "2021"
default-run = "DedsiCodexMosaic"

[[bin]]
name = "DedsiCodexMosaic"
path = "src/main.rs"

[lib]
name = "codex_mosaic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
tokio = { version = "1", features = ["process", "fs", "io-util", "sync", "time", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Pipes", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
