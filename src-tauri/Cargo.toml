[package]
name = "codex-mosaic"
version = "0.0.1"
description = "A multi-conversation Codex workspace"
edition = "2021"
default-run = "DedsiCodexMosaic"

[[bin]]
name = "DedsiCodexMosaic"
path = "src/main.rs"

[lib]
name = "codex_mosaic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
open = "5"
url = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
